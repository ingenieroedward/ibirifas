services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in Dokploy's environment variables}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in Dokploy's environment variables}
      SEED_ORG_CODE: ${SEED_ORG_CODE:-}
      SEED_SUPERADMIN_CODE: ${SEED_SUPERADMIN_CODE:-}
      SEED_ORGANIZER_CODE: ${SEED_ORGANIZER_CODE:-}
      SEED_SELLER_CODE: ${SEED_SELLER_CODE:-}
      # Push notifications. Optional: without the two keys the app runs
      # normally and the bell button simply doesn't appear.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # The public address (https://rifas.tu-dominio.com): links in emails and the allowed origin.
      APP_URL: ${APP_URL:-}
      # Proxies in front of the app that add X-Forwarded-For: 1 = only Dokploy/Traefik,
      # 2 = Cloudflare (orange cloud) + Traefik.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      # Email to buyers (optional). Without SMTP_HOST no email is sent and the
      # reservation form doesn't ask for one.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Cloudflare Turnstile on public reservations (optional anti-bot check).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Daily consistent copy of the database inside the volume (/app/data/backups), last N days.
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_SNAPSHOTS: ${BACKUP_SNAPSHOTS:-}
      # Bre-B payments read from the bank's emails by pagoradar (optional). The secret signs its
      # webhooks; URL + API key let each organizer connect their own account (Mi equipo) and let the
      # app catch up on missed webhooks. PAGORADAR_ORG (legacy) gets payments of unlinked accounts.
      PAGORADAR_WEBHOOK_SECRET: ${PAGORADAR_WEBHOOK_SECRET:-}
      PAGORADAR_ORG: ${PAGORADAR_ORG:-}
      PAGORADAR_URL: ${PAGORADAR_URL:-}
      PAGORADAR_API_KEY: ${PAGORADAR_API_KEY:-}
      # Charging organizers per raffle (README "Cobro por rifa"). BILLING=off turns it off. Prices in pesos
      # (defaults 15000 up to 100 numbers, 35000 above). PAGORADAR_BILLING_ACCOUNT: your own pagoradar
      # receiving account (acc_…) — payments activate raffles on their own. BILLING_WHATSAPP: where to ask
      # for an activation by hand when online payment isn't set up.
      BILLING: ${BILLING:-}
      RAFFLE_PRICE_SMALL: ${RAFFLE_PRICE_SMALL:-}
      RAFFLE_PRICE_LARGE: ${RAFFLE_PRICE_LARGE:-}
      PAGORADAR_BILLING_ACCOUNT: ${PAGORADAR_BILLING_ACCOUNT:-}
      BILLING_WHATSAPP: ${BILLING_WHATSAPP:-}
    volumes:
      - ibirifas_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ibirifas_data:
